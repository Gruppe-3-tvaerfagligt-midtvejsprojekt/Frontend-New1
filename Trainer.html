<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="stylesheet.css">
    <meta charset="UTF-8">
    <title>Tværfaglig</title>

</head>
<body style="
    background-image: url('pokemon baggrund.PNG');
    background-size: cover;
    background-position: center 45%;
    background-repeat: no-repeat;
    background-attachment: fixed;
    min-height: 100vh;
    margin: 0;"
      class="img">
<header>
    <h1>Pokemon Pokedex</h1>
    <input type="text" id="searchInput" placeholder="Search for...">
    <div id="searchResults"></div>
</header>
<main>
    <nav>
        <div id="nav2">
            <a href="homepage.html">
                <button>Homepage</button>
            </a>
            <a href="Pokemon.html">
                <button>Pokemon</button>
            </a>
            <a href="Trainer.html">
                <button>Trainer</button>
            </a>
            <a href="Dashboard.html">
                <button>Dashboard</button>
            </a>
        </div>
    </nav>
    <section class="trainerPage">
    <h2>Trainer</h2>
    <div id="trainerList"></div>
        <hr>
        <h3>Create a New Trainer</h3>

        <form id="createTrainerForm">
            <input type="text" id="trainerNameInput" placeholder="Trainer name" required>
            <input type="text" id="hometownInput" placeholder="Hometown" required>
            <input type="number" id="ageInput" placeholder="Age" min="1" required>

            <button type="submit">Create Trainer</button>
        </form>
        <p id="trainerMessage"></p>

        <h3>Add Pokémon to Trainer</h3>

        <form id="addPokemonForm">
            <select id="trainerSelect" required>
                <option value="">Select a trainer</option>
            </select>

            <select id="pokemonSelect" required>
                <option value="">Select a Pokémon</option>
            </select>

            <button type="submit">Add Pokémon</button>
        </form>

        <p id="pokemonMessage"></p>
    </section>


</main>
<script src="frontend.js"></script>
</body>
</html>
